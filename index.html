h there where you can walk barefoot, and that's usually where I walk.\n\nAt first, walking barefoot felt really weird. But once I got used to it, I actually started to enjoy the feeling of the dirt under my feet.\n\nWhen I walk, I try to focus on whatever I'm feeling at that moment, like the temperature, the smell of the air, the wind, or even the sound of cars in the distance.\n\nIt helps me clear my head and just enjoy the moment.", "cues": ["park mentioned earlier", "dirt path", "barefoot", "felt weird at first", "got used to it", "dirt under feet", "temperature / air / wind / cars", "clear my head"], "finals": ["What do you pay attention to when you go for a walk?", "Tell me why walking in the park is relaxing for you."]}, {"id": 6, "icon": "🐦", "title": "Park Story", "topic": "Birds & Ice Cream", "questions": ["Tell me about a memorable experience at a park.", "Tell me about something unexpected that happened while you were outside."], "answer": "One day, I was watching some birds at the park near my house. I thought they were playing together, but suddenly, one of the birds started attacking the others.\n\nThen, all the birds flew away at once, and it happened so suddenly that I got really startled.\n\nI was so surprised that I dropped the ice cream I was holding.\n\nAt the time, I was like, \"What just happened?\" But looking back, it was actually pretty funny.\n\nSo yeah, that's probably one of the funniest things I've seen at that park.", "cues": ["watching birds", "thought they were playing", "suddenly attacked", "flew away at once", "got startled", "dropped ice cream", "What just happened?", "looking back, funny"], "finals": ["Tell me about a surprising thing you once saw in nature.", "Describe a funny accident that happened to you outdoors."]}, {"id": 7, "icon": "🏃", "title": "Running Routine", "topic": "Five Laps", "questions": ["Tell me about your running routine.", "Why did you start running?"], "answer": "I usually go running at the same park near my apartment.\n\nMy routine is pretty simple. I run five laps around the track. One lap takes me about four minutes, so five laps takes about twenty minutes.\n\nI originally started running because I wanted to lose some weight. But honestly, I'm not sure if running itself is my favorite part.\n\nThe best part is taking a nice, cool shower afterward. After running for twenty minutes, it feels amazing.\n\nSometimes I think I run just for the shower.", "cues": ["same park", "five laps", "four minutes each", "twenty minutes", "lose some weight", "not favorite part", "cool shower afterward", "run for the shower"], "finals": ["Describe exactly what you do when you go running.", "What motivates you to keep running?"]}, {"id": 8, "icon": "🏃🐦", "title": "Running Story", "topic": "Unexpected Birds", "questions": ["Tell me about something unexpected that happened while running.", "Describe a memorable experience you had during a run."], "answer": "Actually, something really weird happened once while I was running at the park.\n\nI was running around the track when I noticed a group of birds nearby. At first, I thought they were just playing together.\n\nBut suddenly, one of them started attacking the others, and they all flew away at once.\n\nIt happened right next to me, so it completely caught me off guard.\n\nI actually stopped running for a second because I was like, \"Wait, what was that?\"\n\nIt was a little scary at the time, but now I think it's pretty funny.", "cues": ["weird thing while running", "group of birds", "thought playing", "started attacking", "flew away", "caught me off guard", "stopped running", "now it's funny"], "finals": ["Tell me about a time something interrupted your exercise.", "What is the strangest thing you've seen while running?"]}, {"id": 9, "icon": "☕", "title": "My Cafe", "topic": "Morning Latte", "questions": ["Tell me about a cafe you often visit.", "What do you usually do when you go to a cafe?"], "answer": "There's a small cafe on the first floor of my apartment building, so it's really convenient.\n\nI usually stop by after my morning walk. They make a really good latte, so that's what I usually order.\n\nI like going there in the morning because it's usually pretty quiet. I get my latte, sit down for a little while, and just relax.\n\nIt's nothing fancy, but it's become part of my morning routine.", "cues": ["first floor", "convenient", "after morning walk", "good latte", "quiet morning", "sit for a while", "relax", "part of routine"], "finals": ["Describe a cafe that is part of your routine.", "Why do you like going to your usual cafe in the morning?"]}, {"id": 10, "icon": "🥤", "title": "Cafe Habits", "topic": "Taste Change", "questions": ["How have your cafe-going habits changed?", "Has your taste in drinks changed over time?"], "answer": "My taste in drinks has actually changed quite a bit.\n\nI used to order really sweet drinks whenever I went to a cafe. You know, things with lots of syrup or whipped cream.\n\nBut these days, I usually go for something less sweet and simple, like a latte.\n\nI don't know why, but whenever I have something too sweet, I get really sleepy. It's kind of annoying, especially during the day.\n\nSo now I usually stick to simple drinks. I guess my taste has gotten a lot simpler over time.", "cues": ["changed quite a bit", "used to order sweet drinks", "syrup / whipped cream", "less sweet now", "latte", "too sweet → sleepy", "stick to simple drinks", "taste got simpler"], "finals": ["Compare the drinks you used to order with what you order now.", "Why did you change the kinds of drinks you order at cafes?"]}, {"id": 11, "icon": "🎧", "title": "Music & Running", "topic": "K-pop", "questions": ["What kind of music do you like?", "When do you usually listen to music?"], "answer": "I'm really into K-pop, and I listen to it a lot when I go running.\n\nThese days, one song I really like running to is \"JUMP\" by BLACKPINK. It has a really strong beat, so it's easy to match my pace to the music.\n\nAnd this might sound a little silly, but sometimes I imagine I'm at a BLACKPINK concert while I'm running.\n\nIt makes running way more exciting, and honestly, I kind of forget that I'm exercising.\n\nSo yeah, music makes running a lot more fun for me.", "cues": ["really into K-pop", "listen while running", "JUMP by BLACKPINK", "strong beat", "match my pace", "imagine a concert", "forget I'm exercising", "more fun"], "finals": ["Tell me how music changes your running experience.", "Describe a song you enjoy listening to while exercising."]}, {"id": 12, "icon": "👹", "title": "Stranger Things", "topic": "Favorite Show", "questions": ["What kind of TV shows do you enjoy?", "Tell me about one of your favorite shows."], "answer": "Well, usually, I enjoy watching Netflix. Have you seen the series Stranger Things?\n\nI really like the creatures in that show. They look grotesque but really interesting. They have these four weird-looking lips and tons of sharp teeth.\n\nI know they look disgusting, but sometimes, the way they move is actually kind of cute.\n\nWhenever they appear on screen, I love watching them run around really fast.\n\nI know that's kind of weird, but that's actually one of the reasons I like the show so much.", "cues": ["Netflix", "Stranger Things", "creatures", "grotesque but interesting", "four lips", "sharp teeth", "kind of cute", "run around fast"], "finals": ["Tell me about something unusual you like about a TV show.", "Recommend a Netflix show and explain what makes it interesting to you."]}, {"id": 13, "icon": "💪", "title": "Physical: 100", "topic": "Memorable TV Moment", "questions": ["Tell me about a memorable moment from a TV show.", "Why did that TV moment stay with you?"], "answer": "The most memorable moment for me was from a show called Physical: 100.\n\nThere was a female athlete who had to compete against this really big guy. I think he weighed over 100 kilograms, and she was much smaller than him.\n\nBut she didn't give up at all. She kept fighting until the very end, and you could tell she was giving it everything she had.\n\nI knew it was just a competition, but I found myself really rooting for her.\n\nThe way she kept trying really touched me.\n\nSo yeah, that's probably one of the most memorable TV moments for me.", "cues": ["Physical: 100", "female athlete", "big guy / 100kg", "much smaller", "didn't give up", "until the end", "rooting for her", "really touched me"], "finals": ["Describe a TV moment that made you emotional.", "Tell me about someone on a show you found yourself rooting for."]}, {"id": 14, "icon": "📱", "title": "Attention Span", "topic": "TV Habits Changed", "questions": ["How have your TV-watching habits changed?", "How has social media affected the way you watch TV?"], "answer": "Well, I used to watch TV shows for an hour without skipping anything when I was a kid.\n\nBut lately, I can't even watch a video for more than five minutes!\n\nI think watching too many short-form videos has kind of ruined my attention span. Most Shorts are less than a minute long, and some are even only ten seconds.\n\nThese days, sometimes I catch myself reaching for my phone while I'm watching Netflix.\n\nThat's when I realize how much my habits have changed.\n\nSo yeah, my attention span has definitely gotten much shorter.", "cues": ["used to watch for an hour", "without skipping", "now five minutes", "short-form videos", "attention span", "Shorts under a minute", "reach for phone", "habits changed"], "finals": ["Compare the way you watched TV as a child with the way you watch it now.", "Tell me how short-form content has affected your media habits."]}], BOSS=[{"title": "Rainy Park Plan", "q": "You were supposed to go for a walk with your friend, but it's raining heavily. Call your friend, explain the situation, and suggest alternatives.", "cues": ["explain the rain", "cancel the park", "suggest the cafe", "suggest Netflix", "make a new plan"]}, {"title": "Neighborhood Guide", "q": "Your friend is visiting your neighborhood. Ask several questions and suggest things you can do together.", "cues": ["Do you like walking?", "barefoot path", "park five minutes away", "grab a latte afterward", "ask preferences"]}, {"title": "Running Problem", "q": "You planned to go running, but something unexpected happened. Explain what happened and suggest another plan.", "cues": ["explain problem", "running plan", "alternative exercise", "yoga at home", "reschedule"]}, {"title": "TV Recommendation", "q": "Your friend wants to start watching a new TV show. Ask about their preferences and recommend something.", "cues": ["What kind of shows?", "sci-fi?", "scary?", "Stranger Things", "explain why"]}], KEY='opic_al_gym_pwa_v1';
let state=JSON.parse(localStorage.getItem(KEY)||'{"xp":0,"done":{}}'),current=null,stage=0,timerId=null,mediaRecorder=null,recordChunks=[],audioURL=null;
const names=['C · CHUNK','R · RECALL','B · BLANK','R · REAL','F · FINAL'];
const done=id=>state.done[String(id)]||[false,false,false,false,false];
function save(){localStorage.setItem(KEY,JSON.stringify(state));stats()}
function stats(){var t=0,m=0;Object.keys(state.done).forEach(function(k){var a=state.done[k];t+=a.filter(Boolean).length;if(a.every(Boolean))m++});document.getElementById('xp').textContent=state.xp||0;document.getElementById('mastered').textContent=m;document.getElementById('bar').style.width=(t/75*100)+'%'}
function home(){var gridEl=document.getElementById('grid');gridEl.innerHTML='';SETS.forEach(s=>{let d=done(s.id),b=document.createElement('button');b.className='card';b.onclick=()=>openSet(s.id);b.innerHTML=`<div class="num">${String(s.id).padStart(2,'0')} · ${d.filter(Boolean).length}/5</div><div class="ico">${s.icon}</div><h3>${s.title}</h3><div class="topic">${s.topic}</div><div class="dots">${d.map(x=>`<i class="dot ${x?'on':''}"></i>`).join('')}</div>`;gridEl.appendChild(b)});let d=done(15),b=document.createElement('button');b.className='card boss';b.onclick=()=>openSet(15);b.innerHTML=`<div class="num">15 · BOSS · ${d.filter(Boolean).length}/5</div><div class="ico">👹</div><h3>Integrated Challenge</h3><div class="topic">Role-play · Problems · Recombination</div><div class="dots">${d.map(x=>`<i class="dot ${x?'on':''}"></i>`).join('')}</div>`;gridEl.appendChild(b);stats()}
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}
function openSet(id){current=id;stage=0;show('study');render()} function goHome(){clearInterval(timerId);stopRecording(true);show('home');home()}
function steps(){let d=done(current);return `<div class="steps">${names.map((n,i)=>`<button class="step ${i===stage?'active':''} ${d[i]?'done':''}" onclick="stage=${i};render()">${n[0]}</button>`).join('')}</div>`}
function speak(t,button){
  if(!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)){toast('TTS not supported');return;}
  var synth=window.speechSynthesis;
  synth.cancel();
  function play(){
    var voices=synth.getVoices() || [];
    var voice=null, i;
    for(i=0;i<voices.length;i++){
      if(/^en-US/i.test(voices[i].lang)){voice=voices[i];break;}
    }
    if(!voice){
      for(i=0;i<voices.length;i++){
        if(/^en/i.test(voices[i].lang)){voice=voices[i];break;}
      }
    }
    var u=new SpeechSynthesisUtterance(t);
    u.lang=voice ? voice.lang : 'en-US';
    if(voice)u.voice=voice;
    u.rate=0.88;
    u.volume=1;
    u.onstart=function(){toast('🔊 Playing');if(button)button.textContent='🔊 Playing...';};
    u.onend=function(){if(button)button.textContent=button.getAttribute('data-label')||'🔊 Listen';};
    u.onerror=function(e){if(button)button.textContent=button.getAttribute('data-label')||'🔊 Listen';toast('🔇 TTS error: '+(e.error||'unknown'));};
    synth.speak(u);
    if(synth.paused)synth.resume();
  }
  if(synth.getVoices().length){play();}
  else{
    var fired=false;
    var onvoices=function(){
      if(fired)return; fired=true;
      synth.removeEventListener('voiceschanged',onvoices);
      play();
    };
    synth.addEventListener('voiceschanged',onvoices);
    setTimeout(function(){if(!fired){fired=true;synth.removeEventListener('voiceschanged',onvoices);play();}},350);
  }
}
function chunks(t){
  var out=[], buf='', i=0, ch='';
  for(i=0;i<t.length;i++){
    ch=t.charAt(i); buf+=ch;
    if((ch==='.'||ch==='!'||ch==='?') && (i===t.length-1 || /\s/.test(t.charAt(i+1)))){
      if(buf.trim()) out.push(buf.trim()); buf='';
    }
  }
  if(buf.trim()) out.push(buf.trim());
  return out;
} function mask(t){let n=0;return t.split(/(\s+)/).map(w=>/^\s+$/.test(w)?w:(++n%4===0?'_____':w)).join('')}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1400)}
function clearStage(){
  var d=done(current);
  if(!d[stage]){
    d[stage]=true;
    state.done[String(current)]=d;
    state.xp=(state.xp||0)+10;
    save();
    toast('+10 XP');
  }
  render();
}
function undoStage(){
  var d=done(current);
  if(d[stage]){
    d[stage]=false;
    state.done[String(current)]=d;
    state.xp=Math.max(0,(state.xp||0)-10);
    save();
    toast('Done 취소');
  }
  render();
}
function doneButton(){
  var d=done(current);
  return d[stage]
    ? '<button class="btn good" onclick="undoStage()">↩ Done 취소</button>'
    : '<button class="btn good" onclick="clearStage()">✓ Done</button>';
}

function timer(){clearInterval(timerId);let n=60,e=document.getElementById('timer');e.textContent=n;timerId=setInterval(()=>{e.textContent=--n;if(n<=0){clearInterval(timerId);toast("Time's up! 🎙️")}},1000)}
async function record(){
 if(mediaRecorder&&mediaRecorder.state==='recording'){stopRecording(false);return}
 try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};mediaRecorder.onstop=()=>{let blob=new Blob(recordChunks,{type:mediaRecorder.mimeType||'audio/webm'});if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(blob);let a=document.getElementById('playback');if(a){a.src=audioURL;a.classList.remove('hidden')}stream.getTracks().forEach(t=>t.stop())};mediaRecorder.start();let b=document.getElementById('rec');if(b){b.textContent='■ Stop';b.classList.add('recording')}toast('Recording…')}
 catch(e){toast('마이크 권한을 허용해주세요')}
}
function stopRecording(silent){if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();mediaRecorder=null;if(!silent){let b=document.getElementById('rec');if(b){b.textContent='● Record';b.classList.remove('recording')}}}
function recordUI(){return `<button id="rec" class="btn light" onclick="record()">● Record</button><audio id="playback" class="hidden" controls></audio>`}
function render(){
 clearInterval(timerId);stopRecording(true);audioURL=null;if(current===15)return boss();
 let s=SETS.find(x=>x.id===current),body='';
 if(stage===0)body=`<h3>🧩 Chunk</h3><div class="tip">문장별로 듣고 따라 말하세요.</div><div class="answer">${chunks(s.answer).map(x=>`<span class="chunk">${x}</span>`).join('')}</div><div class="actions"><button class="btn light tts-btn" data-tts="${encodeURIComponent(s.answer)}">🔊 Answer</button>${doneButton()}</div>`;
 if(stage===1)body=`<h3>🧠 Recall</h3><div class="bigq">${s.questions[0]}</div><button class="btn light tts-btn" data-tts="${encodeURIComponent(s.questions[0])}">🔊 Question</button><div class="cues">${s.cues.map(x=>`<span class="cue">${x}</span>`).join('')}</div><div class="actions"><button class="btn light" onclick="toggle('ans')">👀 Answer</button>${recordUI()}${doneButton()}</div><div id="ans" class="answer hidden">${s.answer}</div>`;
 if(stage===2)body=`<h3>🕳 Blank</h3><div class="answer">${mask(s.answer)}</div><div class="actions"><button class="btn light" onclick="toggle('ans')">👀 Full Answer</button>${recordUI()}${doneButton()}</div><div id="ans" class="answer hidden">${s.answer}</div>`;
 if(stage===3){let rq=s.questions[Math.floor(Math.random()*s.questions.length)];body=`<h3>🎙️ Real Speaking</h3><div class="bigq">${rq}</div><button class="btn light tts-btn" data-tts="${encodeURIComponent(rq)}">🔊 Question</button><div class="timer" id="timer">60</div><div class="tip">NO SCRIPT · NO KEYWORDS · 같은 문장일 필요 없음.</div><div class="actions"><button class="btn" onclick="timer()">▶ 60s</button>${recordUI()}<button class="btn light" onclick="toggle('ans')">👀 Model</button>${doneButton()}</div><div id="ans" class="answer hidden">${s.answer}</div>`;}
 if(stage===4){let q=s.finals[Math.floor(Math.random()*s.finals.length)];body=`<h3>🏁 Final</h3><div class="tip">변형 질문입니다. Chunk를 재조립해서 답하세요.</div><div class="bigq">${q}</div><button class="btn light tts-btn" data-tts="${encodeURIComponent(q)}">🔊 Question</button><div class="timer" id="timer">60</div><div class="actions"><button class="btn" onclick="timer()">▶ Final</button>${recordUI()}<button class="btn light" onclick="toggle('cue')">💡 Cues</button><button class="btn good" onclick="clearStage()">🏆 Clear</button></div><div id="cue" class="cues hidden">${s.cues.map(x=>`<span class="cue">${x}</span>`).join('')}</div>`}
 document.getElementById('studyBody').innerHTML=`<div class="stageHead"><div class="num">${String(s.id).padStart(2,'0')} · ${s.topic}</div><h2>${s.icon} ${s.title}</h2><div class="q">${s.questions.join('<br>')}</div><div class="actions"><button class="btn light tts-btn" data-tts="${encodeURIComponent(s.questions[0])}">🔊 Question</button></div>${steps()}</div><div class="panel">${body}</div>`;
}
function boss(){let b=BOSS[stage%BOSS.length],body=stage<3?`<h3>${stage===0?'🧩 Situation Build':stage===1?'🧠 Recall':'🕳 Minimal Cues'}</h3><div class="bigq">${b.q}</div><div class="cues">${b.cues.filter((_,i)=>stage<2||i%2===0).map(x=>`<span class="cue">${x}</span>`).join('')}</div><div class="actions">${recordUI()}${doneButton()}</div>`:`<h3>${stage===3?'🎙️ Real Role-play':'👹 Final Boss'}</h3><div class="bigq">${(stage===4?BOSS[Math.floor(Math.random()*BOSS.length)]:b).q}</div><div class="timer" id="timer">60</div><div class="actions"><button class="btn" onclick="timer()">⚔️ 60s</button>${recordUI()}<button class="btn good" onclick="clearStage()">${stage===4?'🏆 BOSS CLEAR':'✓ Done'}</button></div>`;document.getElementById('studyBody').innerHTML=`<div class="stageHead"><div class="num">15 · BOSS BATTLE</div><h2>👹 Integrated Challenge</h2><div class="q">Q01–14 표현을 섞어서 즉석 대응합니다.</div>${steps()}</div><div class="panel">${body}</div>`}

document.addEventListener('click',function(e){
  var btn=e.target.closest ? e.target.closest('.tts-btn') : null;
  if(!btn)return;
  e.preventDefault();
  var raw=btn.getAttribute('data-tts')||'';
  var textValue='';
  try{textValue=decodeURIComponent(raw);}catch(err){textValue=raw;}
  if(!btn.getAttribute('data-label'))btn.setAttribute('data-label',btn.textContent); btn.textContent='🔊 Playing...';
  speak(textValue,btn);
});

if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));home();
</script></body></html>
